device: pi1
interval_minutes: 15
run_immediately: true
server:
  upload_url: http://100.78.241.4:8000/api/v1/upload
  api_key: CHANGE_ME
  timeout_seconds: 30
  verify_tls: false
outbox_db: /opt/home-monitor/data/outbox.db
collectors:
  - type: mock
    enabled: false
    system: x1
    values:
      battery_soc: 82
      grid_power: -1200
      pv_power: 3400
  - type: json_http
    enabled: false
    system: gardena
    url: https://example/api/status
    headers:
      Authorization: Bearer CHANGE_ME
    mapping:
      mower_state: status.state
      battery: status.battery.percent
    metadata:
      location: garden
  - type: polygon
    enabled: true
    system: polygon
    ticker_file: /opt/home-monitor/config/tickers.json
    registry_url: http://100.78.241.4:8000/api/v1/instruments/massive-tickers
    registry_api_key: CHANGE_ME
    base_url: https://api.polygon.io
    api_key_env: POLYGON_API_KEY
    multiplier: 15
    timespan: minute
    adjusted: true
    timeout_seconds: 30
    liquidity_target_eur: 10000
    liquidity_participation_rate: 0.10
    liquidity_window_seconds: 1800
  - type: massive_crypto
    enabled: true
    system: crypto
    ticker_file: /opt/home-monitor/config/crypto_tickers.json
    base_url: https://api.polygon.io
    api_key_env: POLYGON_API_KEY
    multiplier: 15
    timespan: minute
    timeout_seconds: 30
    backfill_days: 2
    limit: 50000

  # Energomonitor cloud API collector. First create an API token in the
  # Energomonitor application and run the discovery command documented in README.md.
  - type: energomonitor
    enabled: false
    system: energomonitor
    base_url: https://api.energomonitor.com/v1
    access_token: CHANGE_ME_ENERGOMONITOR_TOKEN
    feed_id: CHANGE_ME_FEED_ID
    timeout_seconds: 20
    lookback_seconds: 3600
    stale_after_seconds: 1800
    fail_on_stale: true
    streams:
      # Recommended: copy stable IDs from the discovery command.
      power_w:
        stream_id: CHANGE_ME_POWER_STREAM_ID
        unit: W
        decimals: 1
      energy_kwh:
        stream_id: CHANGE_ME_ENERGY_STREAM_ID
        unit: kWh
        decimals: 3
      # A selector can be used temporarily when the stream ID is unknown.
      # The collector will fail if zero or multiple streams match.
      # room_temperature_c:
      #   title: Living room temperature
      #   medium: temperature
      #   unit: °C
      #   decimals: 1
    metadata:
      location: home
